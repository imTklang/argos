# docker compose up -d --build
# The dashboard is published on the server's loopback only; reach it from
# your devices through Tailscale (docs/deploy.md). It has no login.
services:
  api:
    build: .
    image: argos
    restart: unless-stopped
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3333:3333"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3333/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 1m
      timeout: 10s
      retries: 3

  worker:
    image: argos
    depends_on: [api]
    restart: unless-stopped
    env_file: .env
    command: ["node", "--import", "tsx", "apps/api/src/worker.ts"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    # A scan in progress finishes before the container stops.
    stop_grace_period: 10m

  # Optional continuous backup of the database to S3-compatible storage
  # (Cloudflare R2, Backblaze B2). Enable with: docker compose --profile backup up -d
  backup:
    image: litestream/litestream:0.3.13
    profiles: [backup]
    restart: unless-stopped
    env_file: .env
    command: replicate
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
